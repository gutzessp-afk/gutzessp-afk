<svg width="1000" height="480" viewBox="0 0 1000 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="profile scan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050a08"/><stop offset="1" stop-color="#07120d"/>
    </linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
      @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(300px)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes flick{0%,100%{opacity:.92}50%{opacity:1}}
      .sweep{animation:sweep 3.2s ease-in-out infinite alternate;}
      .cur{animation:blink 1s step-end infinite;}
      .asc{animation:flick 3s ease-in-out infinite;}
      @media (prefers-reduced-motion:reduce){.sweep,.cur,.asc{animation:none}}
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="478" rx="16" fill="url(#bg)" stroke="#0e3d2b" stroke-width="1.5"/>
