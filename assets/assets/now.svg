  <text x="40" y="156" class="mono" font-size="13" fill="#7de3b8" xml:space="preserve">[ BUILD ]</text>
  <text x="40" y="175" class="mono" font-size="13" fill="#e6fff5" xml:space="preserve">  ▸ sistemas comerciales: POS · inventarios · gestión</text>
  <text x="40" y="194" class="mono" font-size="13" fill="#e6fff5" xml:space="preserve">  ▸ seguimiento de proyectos + chatbots de WhatsApp</text>
  <text x="40" y="213" class="mono" font-size="13" fill="#7de3b8" xml:space="preserve">[ LEARNING ]</text>
