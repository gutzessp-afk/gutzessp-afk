<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050a08"/><stop offset="1" stop-color="#07120d"/>
    </linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes fillbar{from{width:0}}
      @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      .cur{animation:blink 1s step-end infinite;}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="14" fill="url(#bg)" stroke="#0e3d2b" stroke-width="1.5"/>
  <ellipse cx="500.0" cy="120.0" rx="550.0" ry="180.0" fill="url(#gl)"/>
  <circle cx="30" cy="30" r="5.5" fill="#ff5f56"/><circle cx="50" cy="30" r="5.5" fill="#ffbd2e"/><circle cx="70" cy="30" r="5.5" fill="#27c93f"/>
  <text x="500.0" y="34" text-anchor="middle" class="mono" font-size="12" fill="#3f7a63">suat@arch : ~ $ status</text>
  <line x1="14" y1="50" x2="986" y2="50" stroke="#0e3d2b"/>
  <text x="40" y="70" class="mono" font-size="13" fill="#00ff9c" xml:space="preserve">$ cat ~/now.md</text>
