@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-5px,1px)}94%{transform:translate(5px,-2px)}96%{transform:translate(-3px,0)}}
@keyframes inx{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes iny{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
