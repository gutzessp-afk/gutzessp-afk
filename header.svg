<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cloud" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.05"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#1b1b1b"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D70751" stop-opacity="0"/><stop offset="0.5" stop-color="#D70751"/><stop offset="1" stop-color="#D70751" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-5px,1px)}94%{transform:translate(5px,-2px)}96%{transform:translate(-3px,0)}}
@keyframes inx{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes iny{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

.spin{transform-origin:730px 140px;animation:spin 45s linear infinite}
.glitch{animation:glitch 5s infinite}
.l1{animation:inx .6s .3s both} .l2{animation:inx .6s .7s both} .l3{animation:inx .6s 1.1s both}
.cur{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
</style>
